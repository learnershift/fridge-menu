name: Release readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: npm run store-assets && git diff --exit-code

  android-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install exact Android SDK inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prewarm pinned Gradle dependencies
        run: node scripts/android-package.mjs --prewarm
        env:
          FRIDGE_MENU_REQUIRE_UNSIGNED: "1"
      - name: Verify two offline unsigned AAB builds
        run: npm run verify:release
        env:
          FRIDGE_MENU_REQUIRE_UNSIGNED: "1"
      - name: Bind proof bundle to workflow SHA
        run: npm run ci:receipt
      - name: Retain unsigned release proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-release-proof-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            release/artifacts/aab-reproducibility.json
            release/artifacts/release-manifest.json
            release/artifacts/android-evidence.json
            release/artifacts/ci-release-receipt.json
