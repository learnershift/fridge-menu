name: Release readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: npm run store-assets && git diff --exit-code
      - run: npm run release:manifest
      - uses: actions/upload-artifact@v4
        with:
          name: fridge-menu-release-manifest
          path: release/artifacts/release-manifest.json
          if-no-files-found: error
