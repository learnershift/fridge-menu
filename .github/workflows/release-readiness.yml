name: Release readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: npm run store-assets && git diff --exit-code
      # Android release evidence is intentionally not emitted in this Node-only job.
      # `npm run verify:release` requires the pinned local Android toolchain and a real AAB.
