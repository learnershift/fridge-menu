name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact main-branch Git SHA approved by the owner
        required: true
        type: string
      approval_receipt:
        description: Fresh owner approval evidence ID for this Pages deployment
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.approved_sha == github.sha &&
      vars.OWNER_APPROVED_PAGES_SHA == github.sha
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify fresh target-bound owner gate
        env:
          APPROVAL_RECEIPT: ${{ inputs.approval_receipt }}
        run: test -n "$APPROVAL_RECEIPT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
